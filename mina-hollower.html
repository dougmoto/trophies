<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Mina the Hollower — Trophy Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; All games</a>
  <div class="eyebrow"><span class="dot"></span>Graveyard Log — Trophy Tracker</div>
  <h1 id="gameTitle"></h1>
  <p class="sub" id="gameSub"></p>

  <div class="panel">
    <div class="panel-top">
      <span class="panel-label">Progress</span>
      <span class="panel-count">
        <span id="doneCount">0</span> / <span id="totalCount">0</span>
        <em id="pctLabel">(0%)</em>
      </span>
    </div>
    <div class="track"><div class="fill" id="barFill" style="width:0%"></div></div>
    <div class="status-line" id="statusLine">Saved to this device automatically.</div>
  </div>

  <div id="sections"></div>

  <div class="backup">
    <h3>Backup / transfer to another device</h3>
    <textarea id="codeBox" rows="2" readonly placeholder="Your progress code appears here"></textarea>
    <div class="backup-actions">
      <button id="copyBtn">Copy code</button>
      <button id="loadBtn">Paste &amp; restore</button>
    </div>
    <div class="backup-msg" id="backupMsg"></div>
  </div>
</div>

<script src="tracker.js"></script>
