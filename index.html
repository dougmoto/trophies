<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Trophy Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>Case Files</div>
  <h1>Trophy Tracker</h1>
  <p class="sub">Manual progress logs for platinum runs.</p>

  <div class="panel">
    <div class="panel-top">
      <span class="panel-label">Across all games</span>
      <span class="panel-count">
        <span id="allDone">0</span> / <span id="allTotal">0</span>
        <em id="allPct">(0%)</em>
      </span>
    </div>
    <div class="track"><div class="fill" id="allFill" style="width:0%"></div></div>
  </div>

  <a class="cabinet-link" href="cabinet.html">
    <span>
      <span class="cabinet-link-title">Trophy Cabinet</span>
      <span class="cabinet-link-sub">See your completed games on display</span>
    </span>
    <span class="cabinet-link-arrow">&rarr;</span>
  </a>

  <div id="activitySection"></div>

  <p class="section-label">Games</p>
  <div class="games" id="games"></div>

  <footer>
    Progress is stored in this browser on this device. Each game page has a
    backup code you can copy if you switch devices or clear browser data.
  </footer>
</div>

<script src="games.js"></script>
<script>
function readSummary(key) {
  try {
    const raw = localStorage.getItem(key + "-summary-v2");
    if (raw) {
      const s = JSON.parse(raw);
      if (typeof s.done === "number" && typeof s.total === "number") return s;
    }
  } catch (e) {}
  return { done: 0, total: 0 };
}

function readActivity(key, title) {
  try {
    const raw = localStorage.getItem(key + "-activity-v1");
    if (raw) return JSON.parse(raw).map((a) => Object.assign({ game: title }, a));
  } catch (e) {}
  return [];
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = 60000, hr = 3600000, day = 86400000;
  if (diff < hr) return Math.max(1, Math.round(diff / min)) + "m ago";
  if (diff < day) return Math.round(diff / hr) + "h ago";
  const days = Math.round(diff / day);
  if (days === 1) return "yesterday";
  if (days < 7) return days + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderActivity() {
  const container = document.getElementById("activitySection");
  container.innerHTML = "";

  const sevenDaysAgo = Date.now() - 7 * 86400000;
  let all = [];
  GAMES.forEach((g) => { all = all.concat(readActivity(g.key, g.title)); });
  all = all.filter((a) => a.ts >= sevenDaysAgo).sort((a, b) => b.ts - a.ts).slice(0, 8);

  if (all.length === 0) return; // nothing in the last 7 days — stay out of the way

  const label = el("p", "section-label", "Recent Activity");
  container.appendChild(label);

  const panel = el("div", "activity-panel");
  all.forEach((a) => {
    const item = el("div", "activity-item");
    item.appendChild(el("span", "activity-trophy", a.name));
    item.appendChild(el("span", "activity-game", a.game));
    item.appendChild(el("span", "activity-time", timeAgo(a.ts)));
    panel.appendChild(item);
  });
  container.appendChild(panel);
}

function renderGames() {
  const container = document.getElementById("games");
  container.innerHTML = "";

  let sumDone = 0, sumTotal = 0;

  if (!GAMES.length) {
    container.appendChild(el("div", "empty", "No games added yet."));
    return;
  }

  // Most recently updated first; games with no activity yet keep their
  // original order and sink to the bottom.
  const withSummary = GAMES.map((g) => Object.assign({ _summary: readSummary(g.key) }, g));
  withSummary.sort((a, b) => (b._summary.updated || 0) - (a._summary.updated || 0));

  withSummary.forEach((g) => {
    const s = g._summary;
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    const complete = s.total > 0 && s.done === s.total;
    sumDone += s.done;
    sumTotal += s.total;

    const a = el("a", "game");
    a.href = g.file;

    const top = el("div", "game-top");

    const thumb = el("div", "thumb" + (g.emoji ? " emoji" : ""));
    const initials = g.icon || g.title.slice(0, 2).toUpperCase();
    if (g.image) {
      thumb.style.background = g.color;
      const img = document.createElement("img");
      img.alt = "";
      const base = g.image.replace(/\.(png|jpg|jpeg|webp)$/i, "");
      const exts = ["png", "jpg", "jpeg", "webp"];
      const listed = (g.image.match(/\.(png|jpg|jpeg|webp)$/i) || [".png"])[0].slice(1).toLowerCase();
      const tries = [listed].concat(exts.filter((e) => e !== listed));
      let attempt = 0;
      img.addEventListener("error", function () {
        attempt++;
        if (attempt < tries.length) img.src = base + "." + tries[attempt];
        else { img.remove(); thumb.textContent = initials; }
      });
      img.src = base + "." + tries[0];
      thumb.appendChild(img);
    } else if (g.emoji) {
      thumb.style.background = g.color;
      thumb.textContent = g.emoji;
    } else {
      thumb.style.background = g.color;
      thumb.textContent = initials;
    }

    const meta = el("div", "game-meta");
    const title = el("div", "game-title", g.title);
    if (complete) title.appendChild(el("span", "badge plat", "Platinum"));
    meta.appendChild(title);
    meta.appendChild(el("div", "game-sub",
      g.platform + (s.total ? " · " + s.done + " of " + s.total + " trophies" : " · not started")));

    const pctEl = el("div", "game-pct" + (complete ? " complete" : ""), pct + "%");

    top.appendChild(thumb);
    top.appendChild(meta);
    top.appendChild(pctEl);

    const track = el("div", "game-track");
    const fill = el("div", "game-fill");
    fill.style.width = pct + "%";
    fill.style.background = complete ? "linear-gradient(90deg,#ffd479,#fff0c2)" : g.color;
    track.appendChild(fill);

    a.appendChild(top);
    a.appendChild(track);
    container.appendChild(a);
  });

  const allPct = sumTotal ? Math.round((sumDone / sumTotal) * 100) : 0;
  document.getElementById("allDone").textContent = sumDone;
  document.getElementById("allTotal").textContent = sumTotal;
  document.getElementById("allPct").textContent = "(" + allPct + "%)";
  document.getElementById("allFill").style.width = allPct + "%";
}

function renderAll() { renderActivity(); renderGames(); }

renderAll();
window.addEventListener("pageshow", renderAll);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) renderAll();
});
</script>
</body>
</html>
